services:
  - type: web
    name: nexa-pro-lark-dify
    runtime: node
    plan: free
    repo: https://github.com/angelpipo1968/nexa-ai-android
    branch: main
    rootDir: lark-bot
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: LARK_APP_ID
        sync: false
      - key: LARK_APP_SECRET
        sync: false
      - key: LARK_VERIFICATION_TOKEN
        sync: false
      - key: LARK_ENCRYPT_KEY
        sync: false
      - key: DIFY_API_KEY
        sync: false
      - key: DIFY_BASE_URL
        value: https://api.dify.ai/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: GEMINI_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: DEEPL_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_KEY
        sync: false
      - key: GOOGLE_SEARCH_CX
        sync: false
      - key: BRAVE_SEARCH_KEY
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: NASA_API_KEY
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: WOLFRAM_APP_ID
        sync: false
      - key: AVIATIONSTACK_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: ADMIN_SECRET
        generateValue: true
