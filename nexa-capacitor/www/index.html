<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nexa AI</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0f0a1f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 16px; }
    .logo { font-size: 64px; color: #a78bfa; animation: pulse 2s ease-in-out infinite; }
    .title { font-size: 24px; font-weight: 600; }
    .sub { font-size: 14px; opacity: 0.6; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
    }
  </style>
</head>
<body>
  <div class="center">
    <div class="logo">✦</div>
    <div class="title">Nexa AI</div>
    <div class="sub">Cargando servidor...</div>
  </div>
  <!--
    NOTE: No manual redirect here.
    Capacitor loads server.url from capacitor.config.json automatically on launch.
    This file only shows if the server is unreachable (fallback).
  -->
</body>
</html>
