# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Compose
android.enableJetifier=false
android.nonTransitiveRClass=true
android.packagingOptions.jniLibs.useLegacyPackaging=false

# JDK Toolchain — Remove hardcoded path; Android Studio auto-detects JDK
# If needed, set org.gradle.java.home in your local ~/.gradle/gradle.properties

# Suppress compileSdk 35 warning for AGP 8.5.0
android.suppressUnsupportedCompileSdk=35

# Release signing credentials (for native app module)
NEXA_KEYSTORE_PASSWORD=NexaAI2024!Release
NEXA_KEY_ALIAS=nexa
NEXA_KEY_PASSWORD=NexaAI2024!Release
org.gradle.configuration-cache=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
android.disallowKotlinSourceSets=false
ksp.useKSP2=false
