# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Compose
android.enableJetifier=false
android.nonTransitiveRClass=true
android.packagingOptions.jniLibs.useLegacyPackaging=false

# JDK Toolchain — Remove hardcoded path; Android Studio auto-detects JDK
# If needed, set org.gradle.java.home in your local ~/.gradle/gradle.properties

# Suppress compileSdk 35 warning for AGP 8.5.0
android.suppressUnsupportedCompileSdk=36

# Release signing credentials (for native app module)
NEXA_KEYSTORE_PASSWORD=NexaAI2024!Release
NEXA_KEY_ALIAS=nexa
NEXA_KEY_PASSWORD=NexaAI2024!Release
org.gradle.configuration-cache=false
kotlin.incremental.useClasspathSnapshot=false
