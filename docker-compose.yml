# ═══════════════════════════════════════════════════════════════
# Nexa AI - LiteLLM + Ollama Docker Compose
# For RTX 3090 server
# ═══════════════════════════════════════════════════════════════
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f litellm  # View LiteLLM logs
#   docker compose restart litellm  # Restart after config changes
#
# Ports:
#   4000 → LiteLLM (Android connects here!)
#   11434 → Ollama (internal, models live here)
#   3000 → Next.js UI (optional, for web management)
#
# First-time setup:
#   1. docker compose up -d ollama
#   2. docker exec -it nexa-ollama ollama pull qwen2.5:7b
#   3. docker exec -it nexa-ollama ollama pull llava:7b
#   4. docker exec -it nexa-ollama ollama pull qwen2.5-vl:7b  # Optional, better vision
#   5. docker compose up -d litellm
# ═══════════════════════════════════════════════════════════════

version: "3.8"

services:
  # ── Ollama: Local LLM/VLM Runtime ──
  ollama:
    image: ollama/ollama:latest
    container_name: nexa-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── LiteLLM: OpenAI-Compatible API Proxy ──
  # Android connects to http://YOUR-IP:4000/v1/
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: nexa-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=sk-nexa-local-key  # Optional security
      - OLLAMA_API_BASE=http://ollama:11434    # Internal Docker network
    depends_on:
      ollama:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  ollama_data:
    driver: local
