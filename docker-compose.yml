# ═══════════════════════════════════════════════════════════════
# Nexa AI - LiteLLM + Ollama Docker Compose
# For RTX 3090 server
# ═══════════════════════════════════════════════════════════════
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f litellm  # View LiteLLM logs
#   docker compose restart litellm  # Restart after config changes
#
# Ports:
#   4000 → LiteLLM (Android connects here!)
#   11434 → Ollama (internal, models live here)
#   3000 → Next.js UI (optional, for web management)
#
# First-time setup:
#   1. docker compose up -d ollama
#   2. docker exec -it nexa-ollama ollama pull qwen2.5:7b
#   3. docker exec -it nexa-ollama ollama pull llava:7b
#   4. docker exec -it nexa-ollama ollama pull qwen2.5-vl:7b  # Optional, better vision
#   5. docker compose up -d litellm
# ═══════════════════════════════════════════════════════════════

version: "3.8"

services:
  # ── Ollama: Local LLM/VLM Runtime ──
  ollama:
    image: ollama/ollama:latest
    container_name: nexa-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── LiteLLM: OpenAI-Compatible API Proxy ──
  # Android connects to http://YOUR-IP:4000/v1/
  litellm:
    image: ghcr.io/berriai/litellm:latest
    container_name: nexa-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=sk-nexa-local-key  # Optional security
      - OLLAMA_API_BASE=http://ollama:11434    # Internal Docker network
      - UI_USERNAME=admin
      - UI_PASSWORD=sk-nexa-local-key
      - DATABASE_URL=postgresql://litellm:litellmpass@litellm-db:5432/litellm
    depends_on:
      ollama:
        condition: service_healthy
      litellm-db:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── PostgreSQL Database for LiteLLM UI ──
  litellm-db:
    image: postgres:16-alpine
    container_name: nexa-litellm-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=litellmpass
      - POSTGRES_DB=litellm
    volumes:
      - litellm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:
    driver: local
  litellm_db_data:
    driver: local
