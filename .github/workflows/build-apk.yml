name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build Next.js static export
      run: npm run build

    - name: Ensure index.html exists for Capacitor
      shell: bash
      run: |
        if [ ! -f out/index.html ]; then
          echo "index.html missing, creating fallback..."
          mkdir -p out
          printf '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXA AI</title><style>*{margin:0;padding:0}html,body{width:100%%;height:100%%;background:#000}#loading{display:flex;align-items:center;justify-content:center;height:100%%;color:#00e5a0;font-family:system-ui}</style></head><body><div id="loading">Cargando NEXA AI...</div><script>window.location.replace("/chat")</script></body></html>' > out/index.html
          echo "Created fallback index.html"
        fi
        ls -la out/index.html

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Build Release APK (16KB aligned, non-debuggable)
      run: ./gradlew assembleRelease --stacktrace
      working-directory: android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android/app/build/outputs/apk/release/app-release.apk
