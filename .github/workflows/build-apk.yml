name: Build NEXA PRO APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Aceptar licencias Android SDK
      run: yes | sdkmanager --licenses || true

    - name: Instalar dependencias SDK necesarias
      run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

    - name: Dar permisos a Gradle
      run: chmod +x gradlew

    - name: Compilar APK Debug
      run: ./gradlew :android-native-app:assembleDebug --no-daemon --max-workers=2

    - name: Subir APK Debug como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: NEXA-PRO-debug-APK
        path: android-native-app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Compilar APK Release
      run: ./gradlew :android-native-app:assembleRelease --no-daemon --max-workers=2

    - name: Subir APK Release como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: NEXA-PRO-release-APK
        path: android-native-app/build/outputs/apk/release/*.apk
        retention-days: 30
