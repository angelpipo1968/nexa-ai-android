name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build Next.js static export
      run: npm run build

    - name: Ensure index.html exists for Capacitor
      run: |
        echo "=== Contents of out/ ==="
        ls -laR out/ 2>/dev/null || echo "out/ directory missing!"
        echo "=== HTML files ==="
        find out/ -name "*.html" 2>/dev/null || echo "No HTML files found"
        if [ ! -f out/index.html ]; then
          echo "index.html missing — creating shell that loads the app"
          mkdir -p out
          cat > out/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
            <title>NEXA AI</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #000; }
              #loading { display: flex; align-items: center; justify-content: center; height: 100%; color: #00e5a0; font-family: system-ui; }
            </style>
          </head>
          <body>
            <div id="root"><div id="loading">Cargando NEXA AI...</div></div>
            <script>
              // Try loading from Next.js chunks, fallback to redirect
              try {
                var chunks = performance.getEntriesByType('resource').filter(function(r){ return r.name.indexOf('_next') > -1; });
              } catch(e) {}
              // Redirect to chat page which has the full app
              window.location.replace('/chat');
            </script>
          </body>
          </html>
          HTMLEOF
          echo "Created fallback index.html"
        fi
        echo "=== Verifying ==="
        ls -la out/index.html

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Build Release APK (16KB aligned, non-debuggable)
      run: ./gradlew assembleRelease --stacktrace
      working-directory: android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android/app/build/outputs/apk/release/app-release.apk
