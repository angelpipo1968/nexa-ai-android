name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build Next.js static export
      run: npm run build

    - name: Verify export output
      run: |
        echo "Contents of out/ directory:"
        ls -la out/ || echo "out/ directory does not exist!"
        echo "---"
        if [ ! -f out/index.html ]; then
          echo "WARNING: index.html not found in out/. Copying 404.html as fallback..."
          cp out/404.html out/index.html 2>/dev/null || echo "No 404.html either. Checking for other HTML files..."
          find out/ -name "*.html" | head -10
        fi

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission
      run: chmod +x android/gradlew
      working-directory: android

    - name: Build Release APK (16KB aligned, non-debuggable)
      run: ./gradlew assembleRelease --stacktrace
      working-directory: android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android/app/build/outputs/apk/release/app-release.apk
